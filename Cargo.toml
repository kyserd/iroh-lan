[package]
name = "iroh-lan"
description = "iroh-lan = hamachi - account - install"
license = "MIT"
authors = ["Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/iroh-lan"
readme = "README.md"
keywords = ["networking"]
categories = ["network-programming"]
version = "1.0.0"
edition = "2024"


[dependencies]
anyhow = "1"
iroh-topic-tracker = { git = "https://github.com/rustonbsd/iroh-topic-tracker", rev="89f3ab5025242c8cf689b63387a1d1579da2bb7d" }
ed25519-dalek = "3.0.0-pre.1"
iroh = { version="0.97", features=["qlog"] }
iroh-gossip = "0.97.0"
runas = "1"
tokio = "1"
nix = { version = "0.31", features = ["process"] }
self-runas = "0.1"
rand = "0.9"
pnet_packet = "0.35"
tun-rs = { version = "2.7", features = ["async"] }
serde = "1"
futures = "0.3"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
z32 = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
chrono = { version = "0.4" }
n0-watcher = "0.6"

#iroh-auth = { version = "0.1.2" }
iroh-auth = { path="../iroh-auth" } #"0.1.4"
actor-helper = { git = "https://github.com/rustonbsd/actor-helper", rev="9af542cc2d26354dcc4d87d270408326aa319397", features=["anyhow", "tokio"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
noq = { version = "0.17.0" }
url = "2"
iroh-relay = "0.97"

#iroh-quinn = { git = "https://github.com/n0-computer/quinn", rev = "315f491bfbdd0bb04fb8cdb43967b40bfef83d22" }

#iroh = { git = "https://github.com/n0-computer/iroh", rev = "7fc9fb93e2d30badb95a87e2406f225ea73b8b48" }
#iroh-base = { git = "https://github.com/n0-computer/iroh", rev = "7fc9fb93e2d30badb95a87e2406f225ea73b8b48" }
#iroh-relay = { git = "https://github.com/n0-computer/iroh", rev = "7fc9fb93e2d30badb95a87e2406f225ea73b8b48" }
#iroh-gossip = { git = "https://github.com/n0-computer/iroh-gossip", rev = "5f0e768e25e581064027188e6913891da441cd16" }
#noq = { git="https://github.com/n0-computer/noq", rev="8adda44486fdf33f08ae7481b2c3b3a4db587548", package = "noq" }
#noq-proto = { git="https://github.com/n0-computer/noq", rev="8adda44486fdf33f08ae7481b2c3b3a4db587548", package = "noq-proto" }
#noq-udp = { git="https://github.com/n0-computer/noq", rev="8adda44486fdf33f08ae7481b2c3b3a4db587548", package = "noq-udp" }#

[lib]
path = "src/lib.rs"
crate-type = ["lib"]
bench = false

[[bin]]
name = "iroh-lan"
path = "src/bin/cli.rs"

[[example]]
name = "participant"
path = "examples/participant.rs"
crate-type = ["bin"]


[patch.crates-io]
#iroh = { git = "https://github.com/n0-computer/iroh.git", branch = "main" }
#iroh-base = { git = "https://github.com/n0-computer/iroh.git", branch = "main" }
#irpc = { git = "https://github.com/n0-computer/irpc.git", branch = "feat-noq" }
#iroh-gossip = { git = "https://github.com/n0-computer/iroh-gossip.git", rev="5f0e768e25e581064027188e6913891da441cd16" }
