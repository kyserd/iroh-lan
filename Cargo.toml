[package]
name = "iroh-lan"
description = "iroh-lan = hamachi - account - install"
license = "MIT"
authors = ["Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/iroh-lan"
readme = "README.md"
keywords = ["networking"]
categories = ["network-programming"]
version = "1.0.0-pre.1"
edition = "2024"


[dependencies]
anyhow = "1"
iroh-topic-tracker = { git = "https://github.com/rustonbsd/iroh-topic-tracker", rev="6c491a161c40d07a0e4613d0f68924c1fef7d2c4" }
ed25519-dalek = "3.0.0-pre.6"
iroh = { version="0.98.2", features=["address-lookup-pkarr-dht", "qlog", "tls-ring"] }
iroh-gossip = "0.98.0"
runas = "1"
tokio = "1"
nix = { version = "0.31", features = ["process"] }
self-runas = "0.1"
rand = "0.9"
pnet_packet = "0.35"
tun-rs = { version = "2.8", features = ["async"] }
serde = "1"
futures = "0.3"
futures-lite = "2"
postcard = { version = "1", features = ["use-std"] }
sha2 = "0.10"
z32 = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
chrono = { version = "0.4" }
n0-watcher = "0.6.1"
if-addrs = "0.15"
ipnet = "2"

iroh-auth = { git="https://github.com/rustonbsd/iroh-auth", rev="8143b334819fe56863249e5b14e912f1964865e7" }
actor-helper = { version="0.3.0", features=["anyhow", "tokio"]}
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
noq = { version = "0.18" }
url = "2"
iroh-relay = "0.98"

[lib]
path = "src/lib.rs"
crate-type = ["lib"]
bench = false

[[bin]]
name = "iroh-lan"
path = "src/bin/cli.rs"

[[example]]
name = "participant"
path = "examples/participant.rs"
crate-type = ["bin"]


[patch.crates-io]